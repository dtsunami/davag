[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davag"
version = "0.1.0"
description = "DaVinci Resolve AI editing agent — TUI REPL & Web GUI harness"
readme = "DAVAG.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0",
  "google-genai>=1.5.0",
  "openai>=1.68.0",
  "aiohttp>=3.11.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "prompt-toolkit>=3.0.50",
  "rich>=13.9.0",
]

[project.optional-dependencies]
motion = [
  "resvg-py>=0.2.0",
]
whisper = [
  "faster-whisper>=1.1.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
davag = "davag.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
davag = ["ui/web/*", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"